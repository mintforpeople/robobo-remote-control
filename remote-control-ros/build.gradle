apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 34

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
    namespace 'com.mytechia.robobo.framework.remotecontrol.ros'
    lint {
        disable 'InvalidPackage'
    }
}

version = VERSION_NAME

group = GROUP

dependencies {
    // Essential logging dependencies first for IDE resolution
    api 'commons-logging:commons-logging:1.1.1'
    api 'commons-httpclient:commons-httpclient:3.1'
    api 'commons-net:commons-net:2.0'

    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation "com.google.guava:guava:33.5.0-android"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    
    implementation 'com.mytechia:robobo-remote-control:1.0.2'

    // ROS core libraries
    api('org.ros.rosjava_core:rosjava:0.3.6') {
        exclude group: 'org.apache.commons'
    }
    api('org.ros.android_core:android_10:0.3.3') {
        exclude group: 'org.apache.commons'
    }
    
    implementation('org.ros.rosjava_messages:std_msgs:0.5.11')
    implementation('org.ros.rosjava_messages:geometry_msgs:1.12.7')
    implementation('org.ros.rosjava_messages:nav_msgs:1.12.7')

    implementation('gradle.plugin.org.ros2.tools.gradle:ament:0.7.0') {
        exclude group: 'com.android.tools.build', module: 'gradle'
        exclude group: 'org.apache.commons'
    }
    
    // Required for ROS message classes
    api 'org.ros.rosjava_bootstrap:message_generation:0.3.3'

    // Local JAR dependencies
    api files('libs/robobo_msgs-1.2.2.jar')
    api files('libs/aruco_msgs-0.2.3.jar')
    api files('libs/opencv_apps-2.0.1.jar')
    api files('libs/vision_msgs-0.0.1.jar')
}