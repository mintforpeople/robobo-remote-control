apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.mytechia.robobo.framework.remote_control.remote_mdns'
    compileSdk 34

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}


dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'
    api 'com.mytechia:robobo-framework:1.3.4'
    implementation('org.java-websocket:Java-WebSocket:1.5.6'){
        exclude group: 'org.slf4j'
        exclude module: 'slf4j-api'
    }

    implementation project(':remote-control')
}


/*
New local publish module
TODO: Make it able to release on OSS Sonatype to MavenCentral. Not needed by now, we can just upload to the local repo.

Using maven-publish and standard methods to push to maven.
To do the same on other modules, just replace the Chris Bane's script with this
Use gradle publishing:publishLibraryPublicationToLocalNexusRepository to upload artifacts to the repo

If the version ends in -SNAPSHOT, the snapshot repo will be selected.
All of the release info is stored in gradle.properties

Nexus auth should be done in the user's home gradle.properties file (uncommited for security reasons)
 */

afterEvaluate {
    publishing {
        repositories {
            maven {
                name 'LocalNexus'
                allowInsecureProtocol = true
                credentials {
                    username NEXUS_USER
                    password NEXUS_PASSWORD
                }
                if(VERSION_NAME.endsWith('-SNAPSHOT')) {
                    url SNAPSHOT_REPOSITORY_URL
                } else {
                    url RELEASE_REPOSITORY_URL
                }
            }
        }

        publications {
            library(MavenPublication) {
                from components.release
                groupId GROUP
                artifactId POM_ARTIFACT_ID
                version VERSION_NAME
            }
        }
    }
}
