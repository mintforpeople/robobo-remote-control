apply plugin: 'com.android.application'

android {
    namespace = "com.mytechia.robobo.framework.remotecontrol"
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.mytechia.robobo.framework.remotecontrol"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 22
        versionName "1.0.5"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation('androidx.test.espresso:espresso-core:3.5.1', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation 'com.mytechia:robobo-framework:1.3.4'

    implementation 'com.mytechia:robobo-remote-control:1.1.0-SNAPSHOT'
    implementation 'com.mytechia:robobo-remote-control-ws:1.1.0-SNAPSHOT'

    implementation 'com.mytechia:robobo-rob-module:0.3.2'

}
