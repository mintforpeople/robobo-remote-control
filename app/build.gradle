apply plugin: 'com.android.application'

android {
    namespace = "com.mytechia.robobo.framework.remotecontrol"
    compileSdkVersion 33
    configurations.all {
        resolutionStrategy {
            // Force SLF4J 1.7.x — logback-android doesn't support the SLF4J 2.x
            // ServiceLoader-based provider mechanism. Without this, Java-WebSocket
            // and jmdns pull in SLF4J 2.x and logback can't register as a provider.
            force 'org.slf4j:slf4j-api:1.7.36'
        }
    }
    defaultConfig {
        applicationId "com.mytechia.robobo.framework.remotecontrol"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 27
        versionName "1.1.12-SNAPSHOT"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'com.mytechia:robobo-framework:1.3.4'
    implementation 'com.mytechia:robobo-rob:1.1.3'

    testImplementation 'junit:junit:4.13.2'

    implementation project(':remote-control-ws')
    implementation project(':robobo-discovery')
    implementation project(':remote-mdns')
}
